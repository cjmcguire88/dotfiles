# BACKGROUND
background {
    monitor =
    path = ~/Pictures/wallpapers/arch.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172 
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgb(edfefe)
    font_size = 40
    font_family = Fira Sans
    position = 0, 410
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgb(89dceb)
    font_size = 70
    font_family = Fira Sans
    position = 0, 330
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +" %I:%M %p ")</span>"
    color = rgb(edfefe)
    font_size = 40
    font_family = Fira Sans
    position = 0, 230
    halign = center
    valign = center
}

# Profile-Photo
image {
    monitor =
    path = $HOME/.face
    border_size = 2
    border_color = rgba(20212499)
    size = 150
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 60
    halign = center
    valign = center
}

# MAIN-BOX
shape {
    monitor =
    size = 400, 500
    color = rgba(161817aa)
    rounding = 30
    border_size = 0
    border_color = $primary_8_rgba 
    rotate = 0
    xray = false 
    position = 0, -70
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(444444aa)
    rounding = -1
    border_size = 0
    border_color = rgba(edfefe55)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -145
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgb(edfefe)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 18
    font_family = Fira Sans
    position = 0, -145
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(444444aa)
    inner_color = rgba(444444aa)
    font_color = rgb(edfefe)
    fade_on_empty = false
    font_family = Fira Sans
    placeholder_text = <i><span foreground="##edfefe99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# BRIGHTNESS AND BATTERY BOX
shape {
    monitor =
    size = 220, 100
    color = rgb(161817)
    rounding = 30
    border_size = 0
    border_color = rgba(edfefe55)
    rotate = 0
    position = 30, 30
    halign = right
    valign = bottom
}

# BRIGHTNESS
label {
    monitor =
    text = cmd[update:1000] $HOME/Scripts/brightness-level.sh
    color = rgb(edfefe)
    font_size = 18
    position = -80, 80
    halign = right
    valign = bottom
}

# BATTERY
label {
    monitor =
    text = cmd[update:1000] $HOME/Scripts/battery-status.sh
    color = rgb(edfefe)
    font_size = 18
    position = -80, 50
    halign = right
    valign = bottom
}
